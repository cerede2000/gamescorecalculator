name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Portes de publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '25' }

      - name: Porte de publication des bundles
        run: node cli/validate.ts
      - name: Parties de référence (noyau)
        run: node cli/play.ts
      - name: Parties de référence (API HTTP)
        run: node cli/e2e.ts
      - name: P0 — noyau numérique
        run: node p0/verdict.ts
      - name: P0b — langage de formules
        run: node p0/verdict-b.ts

      - name: Le cœur ne connaît aucun jeu
        run: |
          if grep -rniE 'akropolis|flip ?7|dune|imperium|moon colony|bloodbath' packages/rules-core/src; then
            echo "::error::un terme de jeu est apparu dans le noyau"
            exit 1
          fi
          echo "aucun terme de jeu dans packages/rules-core"

  image:
    name: Image de conteneur
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Connexion au registre
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Le conteneur démarre et répond
        if: github.event_name != 'pull_request'
        run: |
          docker run -d --name tablee -p 8080:8080 ghcr.io/${{ github.repository }}:latest
          for i in $(seq 1 30); do
            if curl -fsS localhost:8080/api/health > /tmp/h.json; then break; fi
            sleep 1
          done
          cat /tmp/h.json
          # le nombre attendu se DÉDUIT du dépôt : un chiffre en dur ici
          # échoue au premier jeu ajouté, sans rien dire de l'image
          attendu=$(ls games/*.json | wc -l | tr -d ' ')
          obtenu=$(node -e "console.log(require('/tmp/h.json').games)")
          echo "catalogue servi : $obtenu jeu(x), attendu $attendu"
          test "$obtenu" = "$attendu"
          test "$(node -e "console.log(require('/tmp/h.json').refused.length)")" = "0"
          curl -fsS localhost:8080/ | grep -q "Tablée"
          docker logs tablee
